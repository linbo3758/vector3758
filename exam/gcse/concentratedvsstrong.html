<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Concentrated vs Strong | Vector 3758</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #FCFBF8;
            --paper: #FFFFFF;
            --text: #053D82;
            --accent: #4FCFE7;
            --border: #EBEBEB;
            --hover: #F8FAFE;
        }

        body {
            font-family: "Inter", sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 48px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: auto;
        }

        .logo {
            font-size: 3.8rem;
            font-weight: 600;
            letter-spacing: -3px;
            color: var(--accent);
            line-height: 1.05;
        }

        .divider {
            width: 120px;
            height: 2px;
            background: rgba(5, 61, 130, .18);
            margin: 22px 0 52px;
        }

        .document-meta {
            color: var(--accent);
            font-size: .72rem;
            letter-spacing: 2px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .page-title {
            font-size: 2.6rem;
            font-weight: 600;
            letter-spacing: -1px;
            margin-bottom: 14px;
        }

        .page-desc {
            font-size: 1rem;
            line-height: 1.8;
            opacity: .78;
            max-width: 760px;
            margin-bottom: 40px;
        }

        .pdf-container {
            background: var(--paper);
            border: 1px solid var(--border);
            padding: 14px;
            position: relative;
        }

        .pdf-container::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(5, 61, 130, .035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(5, 61, 130, .035) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
        }

        .pdf-viewer {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 850px;
            display: block;
            border: none;
            background: white;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 18px;
            margin-top: 28px;
        }

        .btn {
            display: inline-block;
            color: var(--text);
            text-decoration: none;
            border-bottom: 1.5px solid var(--text);
            padding-bottom: 3px;
            font-size: .9rem;
            transition: .18s ease;
            background: transparent;
            border-top: none;
            border-left: none;
            border-right: none;
            cursor: pointer;
            font-family: inherit;
        }

        .btn:hover {
            opacity: .65;
        }

        @media(max-width:1000px) {
            body {
                padding: 28px;
            }
            .logo {
                font-size: 3rem;
            }
            .page-title {
                font-size: 2.2rem;
            }
            .pdf-viewer {
                height: 700px;
            }
        }

        @media(max-width:600px) {
            body {
                padding: 20px;
            }
            .logo {
                font-size: 2.5rem;
                letter-spacing: -2px;
            }
            .divider {
                margin-bottom: 40px;
            }
            .page-title {
                font-size: 2rem;
            }
            .page-desc {
                font-size: .92rem;
            }
            .pdf-container {
                padding: 6px;
            }
            .pdf-viewer {
                height: 600px;
            }
            .button-group {
                gap: 16px;
                margin-top: 24px;
            }
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="logo">
            Vector 3758
        </div>

        <div class="divider"></div>

        <div class="document-meta">
            GCSE CHEMISTRY · TOPIC 3 · ACIDS & BASES
        </div>

        <div class="page-title">
            Concentrated vs Strong
        </div>

        <div class="page-desc">
            Understanding the difference between concentration
            and strength of acids and alkalis.
        </div>

        <!-- PDF 使用 Google Docs 查看器 -->
        <div class="pdf-container">
            <iframe
                class="pdf-viewer"
                src="https://docs.google.com/viewer?url=https://raw.githubusercontent.com/linbo3758/vector3758/main/exam/gcse/concentratedvsstrong.pdf&embedded=true"
                title="Concentrated vs Strong">
            </iframe>
        </div>

        <!-- 按钮分开上下排列 -->
        <div class="button-group">
            <a class="btn" href="https://raw.githubusercontent.com/linbo3758/vector3758/main/exam/gcse/concentratedvsstrong.pdf" download>
                Download PDF ↓
            </a>
            <a class="btn" href="../index.html">
                ← Return Home
            </a>
        </div>

    </div>

</body>

</html>
